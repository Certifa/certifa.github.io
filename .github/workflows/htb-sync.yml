# Refreshes the HackTheBox figures on a schedule.
#
# Deliberately separate from the deploy. The site build never talks to HTB, so
# an outage there or an expired token can only mean the stats go stale; it can
# never block a deploy or take the site down. When this job does find a change
# it commits, and that commit triggers the normal Pages deploy.
name: Sync HackTheBox stats

on:
  # Schedule is off until the field mapping is confirmed against a real
  # payload. The first run wrote level 58.52 and an XP pair of 58.52/41.741,
  # which are percentages, not the figures those fields hold. Manual only for
  # now so it cannot put nonsense back on the site overnight.
  # schedule:
  #   - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: htb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch profile and rewrite src/data/htb.ts
        env:
          # The repo secret is named HTB_API; the script reads HTB_TOKEN.
          HTB_TOKEN: ${{ secrets.HTB_API }}
        run: node scripts/update-htb.mjs

      - name: Commit only if a figure actually changed
        run: |
          if git diff --quiet -- src/data/htb.ts; then
            echo "no change"
            exit 0
          fi
          # The sync stamps a date on every run, so a date-only diff is not a
          # real change and must not trigger a deploy of identical content.
          if [ "$(git diff -U0 -- src/data/htb.ts | grep -c '^[+-][^+-]')" -le 2 ] \
             && [ -z "$(git diff -U0 -- src/data/htb.ts | grep '^[+-][^+-]' | grep -v 'Last synced')" ]; then
            echo "only the sync date moved, leaving it"
            git checkout -- src/data/htb.ts
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/htb.ts
          git commit -m "chore(htb): sync profile figures

          Automated by .github/workflows/htb-sync.yml."
          git push
