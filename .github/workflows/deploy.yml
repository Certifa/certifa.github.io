name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The HTB sync commits with the default GITHUB_TOKEN, and GitHub deliberately
  # does not start workflows from those commits so a workflow cannot loop on
  # itself. That meant the sync updated the repo every night for two weeks and
  # never shipped any of it: the figures were correct in git and stale on the
  # site until an unrelated push happened to deploy them.
  #
  # A dispatch from the sync job would be more precise, but this runs half an
  # hour after it and cannot fail quietly, which matters more here than saving
  # one no-op build a day.
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
